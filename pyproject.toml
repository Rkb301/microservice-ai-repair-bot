[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microservice-ai-repair-bot"
version = "0.1.0"
description = "Local-first AI repair bot for GitHub-hosted microservices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain>=1.0.0",
  "langchain-openai>=0.3.0",
  "langgraph>=1.0.0",
  "langsmith>=0.4.0",
  "motor>=3.6.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0.0",
  "requests>=2.31.0",
  "typer>=0.12.0",
  "typing-extensions>=4.10.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
repairbot = "repairbot.cli:app"

[tool.setuptools.packages.find]
include = ["repairbot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
